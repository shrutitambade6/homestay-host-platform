# Target node(s) for the Homestay Host Management Platform.
# Pick ONE of the options below and comment out the other.

[homestay_nodes]
# Option A (simplest on Windows): a clean WSL2 Ubuntu distro, configured from inside itself
homestay-wsl ansible_connection=local

# Option B: a separate Ubuntu 22.04/24.04 VM (VirtualBox / Multipass / cloud) reached over SSH
# homestay-vm ansible_host=192.168.56.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519

[homestay_nodes:vars]
ansible_python_interpreter=/usr/bin/python3
