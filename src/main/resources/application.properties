spring.application.name=homestay-host-platform

# Filled in by Maven resource filtering at build time (Jenkins passes -Dapp.env=<env>)
app.version=@project.version@
app.environment=@app.env@

server.port=${PORT:8080}

# H2 file database. Override the folder with the HOMESTAY_DATA_DIR environment variable
# (Docker sets it to /app/data, which is mounted as a volume).
spring.datasource.url=jdbc:h2:file:${HOMESTAY_DATA_DIR:${user.home}/homestay-data}/homestaydb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.seed-demo-data=true

# Health / info endpoints used by Jenkins smoke tests and Ansible health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Homestay Host Management Platform
info.app.version=@project.version@
info.app.environment=@app.env@

logging.level.com.homestay=INFO
